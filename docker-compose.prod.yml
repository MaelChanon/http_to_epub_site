name: http-to-epub-prod

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    networks: [edge]
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    networks: [edge, internal]
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379"
      SESSION_SECRET: "${SESSION_SECRET}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-session}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-604800}"
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      S3_ENDPOINT: "${S3_PUBLIC_ENDPOINT}"
      S3_REGION: "garage"
      S3_BUCKET: "${S3_BUCKET:-manga}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_started

  # One-off migration runner: `docker compose -f docker-compose.prod.yml
  # --env-file .env.prod --profile tools run --rm api-migrate`
  # Uses the api-builder stage (has drizzle-kit + TS source), not the
  # slim runtime image — see the note in api/Dockerfile.
  api-migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: api-builder
    profiles: ["tools"]
    networks: [internal]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.2.0
    restart: unless-stopped
    networks: [edge]
    ports:
      - "3900:3900"
    volumes:
      - /opt/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

networks:
  edge:
  internal:
    internal: true

volumes:
  pg_data:
  redis_data:
  garage_meta:
  garage_data:
