name: http-to-epub-prod

services:
  web:
    image: ghcr.io/maelchanon/http_to_epub_site-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"

  api:
    image: ghcr.io/maelchanon/http_to_epub_site-api:latest
    restart: unless-stopped
    networks: [edge, internal]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-604800}"
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      S3_ENDPOINT: "http://garage:3900"
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT}"
      S3_REGION: "garage"
      S3_BUCKET: "${S3_BUCKET:-manga}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_started

  postgres:
    image: postgres:18.4
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    networks: [internal]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.2.0
    restart: unless-stopped
    networks: [edge]
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - /opt/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

networks:
  edge:
  internal:
    internal: true

volumes:
  pg_data:
  redis_data:
  garage_meta:
  garage_data:
