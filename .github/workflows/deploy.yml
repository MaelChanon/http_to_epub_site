name: Build, push and deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: MaelChanon
  IMAGE_REPO: http_to_epub_site

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout sibling http_to_epub repo
        uses: actions/checkout@v4
        with:
          repository: MaelChanon/http_to_epub
          path: http_to_epub

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Trigger Portainer deployment webhook
        run: curl --fail --silent --show-error --request POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
